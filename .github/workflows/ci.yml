name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: foodtrip-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /home/ubuntu/foodtrip-api-ts

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm install --frozen-lockfile

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51
        with:
          version: latest

      - run: biome ci .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    name: Build and Package

    needs:
      - quality
      - typecheck
      - test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build Application
        run: pnpm build

      - name: Create Release Package
        run: |
          mkdir -p release

          cp package.json release/
          cp pnpm-lock.yaml release/
          cp ecosystem.config.cjs release/

          cp -r prisma release/
          cp -r dist release/

          tar -C release -czf foodtrip-release.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: foodtrip-api-ts-release
          path: foodtrip-release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to VPS

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    needs:
      - quality
      - typecheck
      - test
      - build

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: foodtrip-api-ts-release
          path: ./release

      - name: Upload Release Artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "./release/foodtrip-release.tar.gz"
          target: "/tmp"

      - name: Upload Deploy Script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "scripts/deploy.sh"
          target: "/tmp"

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            chmod +x /tmp/scripts/deploy.sh

            /tmp/scripts/deploy.sh \
              /tmp/release/foodtrip-release.tar.gz \
              "${{ env.DEPLOY_PATH }}"

      - name: Health Check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            sleep 10

            curl -f http://localhost:3003/health

  summary:
    name: Workflow Summary

    if: always()

    needs:
      - quality
      - typecheck
      - test
      - build
      - deploy

    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary
        run: |
          echo "# 📋 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          echo "| Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Build Information" >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY

          echo "| Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
