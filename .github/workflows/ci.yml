name: CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: foodtrip-production
  cancel-in-progress: true

env:
  DEPLOY_PATH: /home/ubuntu/foodtrip-api-ts

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome ci .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm exec tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Tests
        run: pnpm test

  build:
    name: Build and Package

    runs-on: ubuntu-latest

    needs:
      - quality
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

      - name: Create Release Package
        run: |
          mkdir -p release

          cp package.json release/
          cp pnpm-lock.yaml release/
          cp ecosystem.config.cjs release/

          if [ -f prisma.config.ts ]; then
            cp prisma.config.ts release/
          fi

          cp -r prisma release/
          cp -r dist release/

          # Custom Prisma output
          if [ -d src/generated/prisma ]; then
            mkdir -p release/src/generated
            cp -r src/generated/prisma release/src/generated/
          fi

          tar -C release -czf foodtrip-release.tar.gz .

      - name: Verify Artifact
        run: |
          tar -tzf foodtrip-release.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodtrip-api-ts-release
          path: foodtrip-release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to VPS

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    needs:
      - quality
      - typecheck
      - test
      - build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: foodtrip-api-ts-release
          path: .

      - name: Upload Release Artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "foodtrip-release.tar.gz"
          target: "/tmp"

      - name: Upload Deploy Script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "scripts/deploy.sh"
          target: "/tmp"

      - name: Debug Uploaded Files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            echo "=== Checking Uploaded Files ==="

            find /tmp -name "foodtrip-release.tar.gz" || true
            find /tmp -name "deploy.sh" || true

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            chmod +x /tmp/scripts/deploy.sh

            bash /tmp/scripts/deploy.sh \
              /tmp/foodtrip-release.tar.gz \
              "${{ env.DEPLOY_PATH }}"

      - name: Health Check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            sleep 10

            curl -f http://localhost:3000/health

  summary:
    name: Workflow Summary

    if: always()

    runs-on: ubuntu-latest

    needs:
      - quality
      - typecheck
      - test
      - build
      - deploy

    steps:
      - name: Generate Summary
        run: |
          echo "# CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          echo "| Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Build Info" >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
